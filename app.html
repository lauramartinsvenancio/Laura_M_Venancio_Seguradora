<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Seguro - Carro Forte</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js"></script>
</head>
<body>
    <h2>Calculadora de Seguro</h2>
    <form id="formSeguro">
        <label>Nome do Segurado:
            <input type="text" id="nome" required>
        </label>
        <label>Idade:
            <input type="number" id="idade" required>
        </label>
        <label>Estado Civil:
            <select id="estadoCivil">
                <option value="solteiro">Solteiro</option>
                <option value="casado">Casado</option>
            </select>
        </label>
        <label>Número de Motoristas Adicionais:
            <input type="number" id="motoristasAdicionais" value="0" min="0" required>
        </label>
        <label>Nome do Veículo:
            <input type="text" id="veiculo" required>
        </label>
        <label>Classe do Veículo:
            <select id="classeVeiculo">
                <option value="A">Classe A</option>
                <option value="B">Classe B</option>
                <option value="C">Classe C</option>
            </select>
        </label>
        <button type="button" onclick="calcularSeguro()">Calcular Seguro</button>
    </form>
    <h3>Resultado:</h3>
    <p id="resultado"></p>
</body>
</html>
